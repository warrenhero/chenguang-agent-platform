services:
  mysql:
    image: mysql:8.4
    container_name: mysql-8.4
    restart: unless-stopped
    environment:
      # :? 表示变量缺失时直接启动失败，避免回落到弱密码
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required, see .env.example}
      MYSQL_DATABASE: ${DB_NAME:-chenguang}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      # ./docker/ 是相对项目根写的，启动需加 --project-directory .
      # 宿主机目录不存在时 Docker 会自动创建（含中间层级）
      - ./docker/mysql/data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    ports:
      # 绑定 0.0.0.0，允许远程主机连接（依赖 DB_PASSWORD 强度）
      - "0.0.0.0:3306:3306"
    networks:
      - app-network

  redis:
    image: redis:8.10-alpine
    container_name: redis-8.10
    restart: unless-stopped
    # 密码经环境变量传入，避免出现在 docker inspect 之外的字面量中
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required, see .env.example} --appendonly yes
    volumes:
      - ./docker/redis/data:/data
    ports:
      - "0.0.0.0:6379:6379"
    networks:
      - app-network

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    # image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required, see .env.example}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required, see .env.example}
    volumes:
      - ./docker/minio/data:/data
    ports:
      - "0.0.0.0:9000:9000"
      - "0.0.0.0:9001:9001"
    command: server /data --console-address ":9001"
    networks:
      - app-network


networks:
  app-network:
    driver: bridge
